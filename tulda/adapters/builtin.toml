# Built-in adapters. Overridable by id from user/project/--config files.
#
# TODO(bambu-plate): embedded Metadata/plate_N.png extraction is NOT defined yet
# (low-priority fallback only; see tulda/adapters/bambu.py).
# TODO: `openscad-mesh` (.stl -> png fallback) is phase 4.

[defaults]
width = 1600
height = 1200

[adapter.openscad]
accepts  = [".scad"]
produces = "png"
stage    = "source"
requires = ["openscad"]
version_cmd = ["openscad", "--version"]
# {backend_args} expands to ["--backend=manifold"] when the installed openscad
# supports --backend, else to nothing (see tulda/adapters/probes.py).
cmd = ["openscad", "{backend_args}", "-o", "{out}",
       "--imgsize={w},{h}", "{camera_args}", "{in}"]
timeout = 180
default_views = ["iso", "bottom"]

[adapter.openscad.options]
backend_args = "@probe:openscad_backend"
camera_args = ["--autocenter", "--viewall"]

# Views = camera overrides. --camera=tx,ty,tz,rx,ry,rz,dist (verified against OpenSCAD
# 2026.10.11 --help); with --autocenter --viewall the translation and distance are
# recomputed, so only the three rotation angles matter. The default OpenSCAD view is
# rotation 55,0,25 (= iso here).
[adapter.openscad.views]
iso    = { options = { camera_args = ["--camera=0,0,0,55,0,25,0", "--autocenter", "--viewall"] } }
top    = { options = { camera_args = ["--camera=0,0,0,0,0,0,0", "--autocenter", "--viewall"] } }
bottom = { options = { camera_args = ["--camera=0,0,0,180,0,0,0", "--autocenter", "--viewall"] } }
front  = { options = { camera_args = ["--camera=0,0,0,90,0,0,0", "--autocenter", "--viewall"] } }
back   = { options = { camera_args = ["--camera=0,0,0,90,0,180,0", "--autocenter", "--viewall"] } }
left   = { options = { camera_args = ["--camera=0,0,0,90,0,90,0", "--autocenter", "--viewall"] } }
right  = { options = { camera_args = ["--camera=0,0,0,90,0,270,0", "--autocenter", "--viewall"] } }

# Verified 2026-11-24 with Bambu Studio 02.09.01.70: headless, ~0.3 s, writes
# <outputdir>/plate_1_0.png (512x512 RGBA) plus result.json. --outputdir must
# already exist AND be an absolute path (the runner passes one). --export-png must be
# the only action. Do not kill a running GUI instance.
# --camera-view: --help documents 0 Iso, 1 Top_Front, 2 Left, 3 Right, 10-12 Iso_1-3.
# There is no documented bottom view, but UNDOCUMENTED values were probed on 02.09.01.70
# (output plate_1_<N>.png): 4 = top, 5 = bottom (shows the underside in real filament
# colours, so a bed-face inlay is visible), 6 = front, 7 = rear. 8 repeats 1 and 9 is a
# tiny top view; neither is used. If a Bambu Studio update changes these, the bottom
# view can be redirected via `via` to a chain that renders the underside with OpenSCAD.
[adapter.bambu-export-png]
accepts  = [".3mf"]
produces = "png"
stage    = "sliced"
requires = ["/Applications/BambuStudio.app/Contents/MacOS/BambuStudio"]
cmd = ["/Applications/BambuStudio.app/Contents/MacOS/BambuStudio",
       "--export-png", "{plate}", "--camera-view", "{camera_view}",
       "--outputdir", "{workdir}", "{in}"]
out_glob = "plate_*.png"
timeout = 120
default_views = ["iso", "bottom"]

[adapter.bambu-export-png.options]
plate = 1
camera_view = 0

[adapter.bambu-export-png.views]
iso       = { options = { camera_view = 0 } }
top-front = { options = { camera_view = 1 } }
left      = { options = { camera_view = 2 } }
right     = { options = { camera_view = 3 } }
top       = { options = { camera_view = 4 } }
bottom    = { options = { camera_view = 5 } }
front     = { options = { camera_view = 6 } }
rear      = { options = { camera_view = 7 } }

# ---- mesh stage: sources -> .glb for the interactive viewer (/_v/<project>/<name>/) ----
# These are selected by the `interactive` view (`tulda render --views interactive`), never by
# normal PNG planning (kind = "mesh"). Python adapters: tulda/adapters/meshes.py.
[adapter.mesh-scad]
kind     = "mesh"
accepts  = [".scad"]
produces = "glb"
stage    = "mesh"
requires = ["openscad"]
version_cmd = ["openscad", "--version"]
python   = "builtin:scad_mesh"

[adapter.mesh-3mf]
kind     = "mesh"
accepts  = [".3mf"]
produces = "glb"
stage    = "mesh"
python   = "builtin:threemf_mesh"

[adapter.mesh-stl]
kind     = "mesh"
accepts  = [".stl"]
produces = "glb"
stage    = "mesh"
python   = "builtin:stl_mesh"

# ---- slice stage: .3mf -> slice summary page (`slice` view only) ----
# Bambu Studio slices a COPY of the model in a scratch dir (the source is never touched) and
# tulda parses the resulting gcode FEATURE markers and slice_info.config (print time,
# filament, layers, supports / brim / skirt / prime tower yes-no). Verified 2026-11-24 with
# Bambu Studio 02.09.01.70, ~2 s. --export-3mf is relative to --outputdir; the logged
# "Invalid T command (T65535)" error is benign. Python adapter: tulda/adapters/slicing.py.
[adapter.slice-bambu]
kind     = "slice"
accepts  = [".3mf"]
produces = "htm"
stage    = "sliced"
requires = ["/Applications/BambuStudio.app/Contents/MacOS/BambuStudio"]
python   = "builtin:bambu_slice"
timeout  = 240

[adapter.slice-bambu.options]
bambu_bin = "/Applications/BambuStudio.app/Contents/MacOS/BambuStudio"
slice_timeout = 180

# ---- turntable stage: .scad -> 36 PNG frames (no-WebGL fallback + drag-to-rotate widget) ----
# Selected by the `turntable` view only. OpenSCAD renders ~0.25 s per 800x600 frame (4 in
# parallel). Bambu Studio only has fixed camera presets, so .3mf has no turntable.
[adapter.turntable-scad]
kind     = "turntable"
accepts  = [".scad"]
produces = "png"
stage    = "source"
requires = ["openscad"]
version_cmd = ["openscad", "--version"]
python   = "builtin:scad_turntable"
timeout  = 600

[adapter.turntable-scad.options]
frames = 36
